<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hex Turmites</title>
  <style>
    body { margin: 0; background: #11151c; color: #cdd2da; font-family: system-ui, sans-serif; display: flex; }
    #controlPanel { width: 250px; padding: 14px; box-sizing: border-box; flex: 0 0 250px; }
    #controlPanel h3 { margin: 0 0 4px; }
    #controlPanel .sub { font-size: 11px; color: #6f757f; margin: 0 0 12px; line-height: 1.4; }
    .ctl { display: block; margin: 9px 0; font-size: 12px; }
    .ctl input { width: 100%; }
    .ctl select { display: block; width: 100%; margin-top: 3px; background: #161b23; color: #cdd2da;
                  border: 1px solid #2a313c; border-radius: 4px; padding: 2px 4px; font-size: 12px; }
    .ctl.toggle { cursor: pointer; }
    .ctl.toggle input { width: auto; margin: 0 4px 0 0; vertical-align: middle; }
    .btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    button { background: #2b6cf6; color: #fff; border: 0; border-radius: 6px; padding: 5px 9px; cursor: pointer; font-size: 12px; }
    button:hover { background: #3f7cff; }
    #status { font-size: 12px; color: #8a8f98; margin-top: 14px; line-height: 1.5; }
    canvas { background: #0b0e13; display: block; }
  </style>
</head>
<body>
  <div id="controlPanel">
    <h3>Hex Turmites</h3>
    <p class="sub">Every living cell is a turmite: a colour, a face, and a genome keyed on
      the single cell it faces. It recolours, turns, and copies itself forward.</p>
    <div id="status"></div>
  </div>
  <canvas id="gameWorld" width="1320" height="760"></canvas>

  <!-- socket.io client (for the standard DB client in socket mode) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <!-- sim core, in dependency order; main.js last -->
  <script src="src/util.js"></script>
  <script src="src/params.js"></script>
  <script src="src/hex.js"></script>
  <script src="src/genome.js"></script>
  <script src="src/db.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/world.js"></script>
  <script src="src/observer.js"></script>
  <script src="src/stats.js"></script>
  <script src="src/views.js"></script>
  <script src="src/datamanager.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
